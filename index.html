header{
background:#081B4B;

.logo{

.card{

.card img{

height:260px;

.contact{

right:20px;
bottom:20px;
background:#25D366;
color:white;
padding:18px 28px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
